# OpenBB Platform API for Dokploy.
#
# Domain: service `openbb`, container port 6900.
# Provider keys: set FRED_API_KEY in Dokploy env (passed into this service).
# OpenBB reads it at process start. The openbb_data volume is only cache.
#
# Valuation, auth, and the SPA live in aifinance-frontend (odp-markets).

services:
  openbb:
    build:
      context: .
      dockerfile: build/docker/platformAPI.Dockerfile
    restart: unless-stopped
    expose:
      - "6900"
    environment:
      OPENBB_AUTO_BUILD: "false"
      DATABASE_URL: ${DATABASE_URL:-}
      VALUATION_DATABASE_URL: ${VALUATION_DATABASE_URL:-}
      VALUATION_SCHEMA: ${VALUATION_SCHEMA:-valuation}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-luminous}
      FRED_API_KEY: ${FRED_API_KEY:-}
    volumes:
      - openbb_data:/root/.openbb_platform
    networks:
      default:
      dokploy-network:
        aliases:
          - openbb-api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6900')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  dokploy-network:
    external: true

volumes:
  openbb_data:
